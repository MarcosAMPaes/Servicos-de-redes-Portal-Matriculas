<!DOCTYPE html>
<html lang="pt-BR" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Portal de Matrículas</title>
  <meta name="description" content="Sistema acadêmico de gestão de alunos, cursos e matrículas." />
  <meta name="author" content="Grupo 4 - Serviços de Redes para Internet" />

  <link rel="icon" type="image/svg+xml"
        href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%231F2933'/><text x='50%25' y='55%25' dominant-baseline='middle' text-anchor='middle' font-family='monospace' font-size='11' font-weight='700' fill='white'>P/M</text></svg>" />

  <script>
    try {
      const temaSalvo = localStorage.getItem('pm-theme');
      if (temaSalvo) document.documentElement.dataset.theme = temaSalvo;
    } catch (_) {}
  </script>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap"
        rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />

  <style>
    #loading-screen {
      position: fixed;
      inset: 0;
      background: var(--bg-page);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 18px;
      z-index: 9999;
      transition: opacity 0.3s ease;
    }

    #loading-screen.oculto {
      opacity: 0;
      pointer-events: none;
    }

    .loading-logo {
      width: 48px;
      height: 48px;
      border-radius: 12px;
      background: var(--ink-900);
      color: var(--bg-page);
      display: grid;
      place-items: center;
      font-family: var(--font-mono);
      font-size: 15px;
      font-weight: 700;
    }

    .loading-barra-trilha {
      width: 160px;
      height: 3px;
      background: var(--line);
      border-radius: 999px;
      overflow: hidden;
    }

    .loading-barra-preenchimento {
      height: 100%;
      width: 40%;
      background: var(--primary);
      border-radius: 999px;
      animation: carregando 1.4s ease-in-out infinite alternate;
    }

    @keyframes carregando {
      from { transform: translateX(-150%); }
      to { transform: translateX(400%); }
    }

    .loading-rotulo {
      font-family: var(--font-mono);
      font-size: 11px;
      color: var(--ink-500);
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }
  </style>

  <!-- Dependências -->
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js"
          integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L"
          crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js"
          integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm"
          crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js"
          integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y"
          crossorigin="anonymous"></script>
</head>

<body>
  <div id="loading-screen" aria-hidden="true">
    <div class="loading-logo">P/M</div>
    <div class="loading-barra-trilha">
      <div class="loading-barra-preenchimento"></div>
    </div>
    <span class="loading-rotulo">Carregando...</span>
  </div>

  <div id="root" role="application" aria-label="Portal de Matrículas"></div>

  <noscript>
    <div style="font-family:sans-serif;padding:40px;text-align:center;max-width:480px;margin:80px auto">
      <strong style="font-size:18px;display:block;margin-bottom:12px">Portal de Matrículas</strong>
      <p style="color:#666;line-height:1.6">
        Este portal requer JavaScript habilitado.<br>
        Ative o JavaScript no navegador e recarregue a página.
      </p>
    </div>
  </noscript>

  <!-- Aplicação -->
  <script type="text/babel" src="api.jsx"></script>
  <script type="text/babel" src="data.jsx"></script>
  <script type="text/babel" src="ui.jsx"></script>
  <script type="text/babel" src="login.jsx"></script>
  <script type="text/babel" src="shell.jsx"></script>
  <script type="text/babel" src="admin-dashboard.jsx"></script>
  <script type="text/babel" src="admin-alunos.jsx"></script>
  <script type="text/babel" src="admin-cursos.jsx"></script>
  <script type="text/babel" src="admin-matriculas.jsx"></script>
  <script type="text/babel" src="aluno.jsx"></script>
  <script type="text/babel" src="app.jsx"></script>

  <script>
    (function () {
      var root = document.getElementById('root');
      var screen = document.getElementById('loading-screen');
      if (!root || !screen) return;

      var observer = new MutationObserver(function () {
        if (root.children.length > 0) {
          screen.classList.add('oculto');
          setTimeout(function () {
            if (screen.parentNode) screen.parentNode.removeChild(screen);
          }, 350);
          observer.disconnect();
        }
      });

      observer.observe(root, { childList: true });
    })();
  </script>
</body>
</html>
