# ──────────────────────────────────────────────────────────────────────────
# Portal de Matrículas — Configuração NGINX
#
# Fase 1: somente HTTP (porta 8080 interna → porta 80 no host).
# HTTPS (porta 8443 → 443) será habilitado como diferencial em fase posterior.
#
# Mapeamento de portas no docker-compose:
#   host:80  → container:8080   (este bloco server)
#   host:443 → container:8443   (futuro — bloco server com ssl)
# ──────────────────────────────────────────────────────────────────────────

server {
    listen 8080;
    server_name localhost;

    # ── Frontend estático ─────────────────────────────────────────────────
    # Os arquivos de /usr/share/nginx/html são montados via volume no compose.
    #
    # try_files: tenta servir o arquivo exato ($uri), depois o diretório
    # ($uri/), e por último retorna index.html — necessário para SPAs onde
    # o roteamento acontece no browser (React, Vue, etc.).
    location / {
        root  /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # ── Proxy reverso para o FastAPI ─────────────────────────────────────
    # Requisições para /api/* são encaminhadas ao container "fastapi".
    # O nome "fastapi" é resolvido pelo DNS interno da rede netatividade01.
    #
    # proxy_pass: a barra no final é importante!
    #   /api/alunos → http://fastapi:8080/api/alunos  ✓
    location /api/ {
        proxy_pass         http://fastapi:8080/api/;
        proxy_http_version 1.1;

        # Cabeçalhos que identificam a origem real da requisição
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
