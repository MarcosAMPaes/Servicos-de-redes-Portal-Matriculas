services:
  postgres:
    image: postgres:16-alpine
    container_name: portal_postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-portal_matriculas}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-20241si017}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - backend_db
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  loki:
    image: grafana/loki:3.0.0
    container_name: portal_loki
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - ./loki/loki-config.yaml:/etc/loki/local-config.yaml:ro
      - loki_data:/loki
    networks:
      - backend_db
    restart: unless-stopped

  fastapi:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: portal_fastapi
    environment:
      DATABASE_URL: ${DATABASE_URL:-}
      POSTGRES_DB: ${POSTGRES_DB:-portal_matriculas}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_HOST: ${POSTGRES_HOST:-postgres}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-20241si017}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-trocar_esta_chave_em_ambiente_real}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      JWT_EXPIRES_MINUTES: ${JWT_EXPIRES_MINUTES:-120}
      LOKI_URL: ${LOKI_URL:-http://loki:3100}
      LOKI_SERVICE_NAME: ${LOKI_SERVICE_NAME:-fastapi}
      LOKI_ENABLED: ${LOKI_ENABLED:-true}
    volumes:
      - ./backend/app:/app/app
    networks:
      - backend_db
      - web
    depends_on:
      postgres:
        condition: service_healthy
      loki:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  nginx:
    build:
      context: .
      dockerfile: nginx/Dockerfile
    container_name: portal_nginx
    ports:
      - "80:8080"
      - "443:8443"
    networks:
      - web
    depends_on:
      fastapi:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/api/health >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped

networks:
  backend_db:
    internal: true
  web:

volumes:
  postgres_data:
  loki_data:
