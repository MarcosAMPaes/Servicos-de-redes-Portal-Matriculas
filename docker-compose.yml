services:
  postgres:
    image: postgres:16-alpine
    env_file: .env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - backend_db
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      retries: 5

  fastapi:
    build: ./backend
    env_file: .env
    networks:
      - backend_db
      - web
    depends_on:
      postgres:
        condition: service_healthy

  nginx:
    build: ./frontend
    ports:
      - "80:8080"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - web
    depends_on:
      - fastapi

networks:
  backend_db:
    internal: true
  web:

volumes:
  postgres_data:
